<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stocheo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0e17;
      color: #e0e6f0;
      height: 100vh;
      overflow: hidden;
    }

    canvas { position: fixed; top: 0; left: 0; z-index: 0; }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .tagline {
      font-size: 1.1rem;
      color: #667;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 1;
      font-size: 0.8rem;
      color: #445;
    }

    footer a { color: #556; text-decoration: none; margin: 0 0.5rem; }
    footer a:hover { color: #88a; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="content">
    <h1>Stocheo</h1>
    <p class="tagline">Coming soon</p>
  </div>
  <footer>&copy; 2026 Stocheo</footer>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let w, h, lines;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      init();
    }

    function init() {
      lines = [];
      const count = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        const points = [];
        const segments = 80;
        const baseY = h * (0.25 + Math.random() * 0.5);
        const drift = (Math.random() - 0.5) * 0.3;
        const vol = 20 + Math.random() * 40;
        let y = baseY;
        for (let j = 0; j <= segments; j++) {
          y += drift + (Math.random() - 0.5) * vol * 0.3;
          points.push({ x: (j / segments) * w, y });
        }
        const hue = 200 + Math.random() * 40;
        const alpha = 0.08 + Math.random() * 0.12;
        lines.push({ points, color: `hsla(${hue}, 60%, 55%, ${alpha})` });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);

      // grid
      ctx.strokeStyle = 'rgba(40, 50, 70, 0.3)';
      ctx.lineWidth = 0.5;
      const step = 60;
      for (let x = 0; x < w; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // lines
      for (const line of lines) {
        ctx.beginPath();
        ctx.strokeStyle = line.color;
        ctx.lineWidth = 1.5;
        const pts = line.points;
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          const xc = (pts[i - 1].x + pts[i].x) / 2;
          const yc = (pts[i - 1].y + pts[i].y) / 2;
          ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y, xc, yc);
        }
        ctx.stroke();

        // glow
        ctx.strokeStyle = line.color.replace(/[\d.]+\)$/, '0.03)');
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          const xc = (pts[i - 1].x + pts[i].x) / 2;
          const yc = (pts[i - 1].y + pts[i].y) / 2;
          ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y, xc, yc);
        }
        ctx.stroke();
      }
    }

    window.addEventListener('resize', () => { resize(); draw(); });
    resize();
    draw();
  </script>
</body>
</html>
